<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#000}
svg{display:block}
</style></head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1b3a8a"/>
      <stop offset="0.55" stop-color="#0e1a4a"/>
      <stop offset="1" stop-color="#050818"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fe0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fe0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.5" stop-color="#f3c14b"/>
      <stop offset="1" stop-color="#b9821c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9be7ff"/>
      <stop offset="0.5" stop-color="#3d7bff"/>
      <stop offset="1" stop-color="#b48cff"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- subtle rays -->
  <g opacity="0.10" stroke="#9be7ff" stroke-width="3">
    <line x1="512" y1="400" x2="512" y2="40"/>
    <line x1="512" y1="400" x2="200" y2="120"/>
    <line x1="512" y1="400" x2="824" y2="120"/>
    <line x1="512" y1="400" x2="90" y2="330"/>
    <line x1="512" y1="400" x2="934" y2="330"/>
  </g>

  <!-- circle frame (safe area for Telegram round crop) -->
  <circle cx="512" cy="512" r="470" fill="none" stroke="url(#ring)" stroke-width="10" opacity="0.85"/>
  <circle cx="512" cy="512" r="448" fill="none" stroke="#9be7ff" stroke-width="2" opacity="0.35"/>

  <ellipse cx="512" cy="400" rx="300" ry="260" fill="url(#glow)"/>

  <!-- Diamond -->
  <g transform="translate(512 400)">
    <!-- crown facets -->
    <polygon points="-230,-60 -150,-170 -60,-60" fill="#bff3ff"/>
    <polygon points="-150,-170 0,-170 -60,-60" fill="#e9fbff"/>
    <polygon points="0,-170 150,-170 60,-60" fill="#9fe6ff"/>
    <polygon points="-60,-60 0,-170 60,-60" fill="#ffffff"/>
    <polygon points="150,-170 230,-60 60,-60" fill="#6fd2ff"/>
    <!-- pavilion facets -->
    <polygon points="-230,-60 -60,-60 0,210" fill="#58b9f5"/>
    <polygon points="-60,-60 60,-60 0,210" fill="#8fdcff"/>
    <polygon points="60,-60 230,-60 0,210" fill="#2f8fe0"/>
    <polygon points="-230,-60 -120,-60 0,210" fill="#7ccfff" opacity="0.6"/>
    <polygon points="120,-60 230,-60 0,210" fill="#1f6fc4" opacity="0.6"/>
    <!-- outline -->
    <polygon points="-150,-170 150,-170 230,-60 0,210 -230,-60" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" opacity="0.9"/>
    <polyline points="-230,-60 230,-60" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
    <!-- sparkles -->
    <g fill="#ffffff">
      <path d="M-170,-200 l8,-30 l8,30 l30,8 l-30,8 l-8,30 l-8,-30 l-30,-8z"/>
      <path d="M200,-120 l6,-22 l6,22 l22,6 l-22,6 l-6,22 l-6,-22 l-22,-6z"/>
      <path d="M150,150 l5,-18 l5,18 l18,5 l-18,5 l-5,18 l-5,-18 l-18,-5z" opacity="0.8"/>
    </g>
  </g>

  <!-- Text -->
  <text x="512" y="742" text-anchor="middle"
        font-family="DejaVu Sans, Arial, sans-serif" font-weight="800"
        font-size="104" letter-spacing="6" fill="url(#gold)"
        stroke="#5a3a05" stroke-width="2">RAKHIMOV</text>
  <text x="512" y="836" text-anchor="middle"
        font-family="DejaVu Sans, Arial, sans-serif" font-weight="700"
        font-size="64" letter-spacing="14" fill="#9be7ff">ALMAZ BOT</text>
</svg>
</body></html>
